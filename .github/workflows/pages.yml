name: Deploy Aetherwild to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Test game logic
        run: npm test
      - name: Check source and assets
        run: npm run check
      - name: Upload playable game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy playable game
        id: deployment
        uses: actions/deploy-pages@v4
